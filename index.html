<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#070b16" />
<title>Morph Head Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#070b16;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 18%,#1b2745 0,#070b16 62%)}
#stage{position:absolute;inset:0 0 36vh 0;touch-action:none;overflow:hidden;transition:bottom .22s ease}
body.compact #stage{inset:0 0 86px 0}
#canvasHost{position:absolute;inset:0}
#boot{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px;color:#dbeafe;pointer-events:none}
#boot b{display:block;font-size:18px;margin-bottom:8px;color:#fff}
#panel{position:absolute;left:0;right:0;bottom:0;height:38vh;min-height:270px;display:flex;flex-direction:column;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(7,11,22,.99));border-radius:22px 22px 0 0;border-top:1px solid rgba(255,255,255,.16);box-shadow:0 -18px 60px rgba(0,0,0,.45);transition:height .22s ease,min-height .22s ease,padding .22s ease}
body.compact #panel{height:86px;min-height:86px;padding:7px 12px calc(7px + env(safe-area-inset-bottom));overflow:hidden}
#grab{appearance:none;border:0;width:72px;height:20px;border-radius:999px;background:rgba(255,255,255,.12);margin:0 auto;display:grid;place-items:center;color:#aab4d4;font-size:10px;font-weight:900;padding:0;min-height:20px;flex:0 0 auto}
#grab::before{content:"Hide"}
body.compact #grab::before{content:"Controls"}
#grab::after{content:"";width:42px;height:5px;border-radius:999px;background:rgba(255,255,255,.38);display:block;position:absolute}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
h1{font-size:17px;line-height:1;margin:0 0 3px;color:#fff;white-space:nowrap}
#status{font-size:11.5px;color:#aab4d4;min-height:15px;direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw}
.upload{direction:ltr;background:#7dd3fc;color:#062033;font-weight:900;border-radius:14px;padding:8px 10px;font-size:12px;white-space:nowrap;box-shadow:0 8px 24px rgba(125,211,252,.18)}
.upload input{display:none}
.row{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;flex:0 0 auto;padding-bottom:1px;direction:ltr}
button{border:1px solid rgba(255,255,255,.16);background:#172033;color:#dbeafe;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:800;white-space:nowrap;min-height:32px}
button.on{background:#7dd3fc;color:#061726;border-color:#7dd3fc}
#sliders{overflow:auto;padding:1px 2px 8px;display:flex;flex-direction:column;gap:8px;direction:ltr;min-height:0}
.slider{display:grid;grid-template-columns:minmax(118px,1fr) 1.35fr 33px;align-items:center;gap:8px;color:#dce7ff;font-size:11px;text-align:left}
.slider span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slider output{text-align:right;color:#9fb1da;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#7dd3fc}
#error{display:none;background:#7f1d1d;color:#fecaca;border:1px solid rgba(254,202,202,.34);border-radius:12px;padding:7px 9px;font-size:12px;line-height:1.35;direction:rtl}
#error.show{display:block}
.hint{font-size:10.5px;color:#93a4c8;line-height:1.35;direction:rtl;text-align:right}
body.compact .row,body.compact #sliders,body.compact .hint,body.compact #error{display:none!important}
@media(min-width:760px){#stage{inset:0 360px 0 0}body.compact #stage{inset:0 88px 0 0}#panel{top:0;right:0;left:auto;height:100%;min-height:100%;width:360px;border-radius:0;padding-top:18px}body.compact #panel{width:88px;height:100%;min-height:100%;padding:10px 8px}body.compact header{display:none}#grab{margin:0 auto 8px}.slider{grid-template-columns:minmax(140px,1fr) 1.3fr 34px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body class="compact">
<div id="app">
<main id="stage"><div id="canvasHost"></div><div id="boot"><div><b>Morph Head Studio</b><span>טוען מנוע תלת־ממד...</span></div></div></main>
<section id="panel">
<button id="grab" aria-label="פתיחה וסגירה של הפאנל"></button>
<header><div><h1>Morph Head Studio</h1><div id="status">מאתחל...</div></div><label class="upload">Upload GLB<input id="fileInput" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" /></label></header>
<div id="error"></div>
<div class="row"><button id="loomisBtn" class="on">Loomis</button><button id="wireBtn">Wire</button><button id="centerBtn">Center</button><button id="resetBtn">Reset</button><button id="reloadBtn">Reload</button></div>
<div class="row"><button data-preset="smile">Smile</button><button data-preset="surprise">Surprise</button><button data-preset="angry">Angry</button><button data-preset="talk">Talk</button></div>
<div class="row" id="tabs"><button data-tab="all" class="on">All</button><button data-tab="eyes">Eyes</button><button data-tab="mouth">Mouth</button><button data-tab="brows">Brows</button></div>
<div class="hint">המודל הוא GLB פיזי מתוך הריפו. האפליקציה מסתירה גוף/בגדים ומתמקדת בראש. גרירה מסובבת, שני אצבעות מזיזות/מגדילות.</div>
<div id="sliders"></div>
</section>
</div>
<script>
function showBootError(message){var s=document.getElementById('status'),e=document.getElementById('error'),b=document.getElementById('boot');if(s)s.textContent='שגיאה בטעינה';if(e){e.textContent=String(message);e.classList.add('show')}if(b)b.innerHTML='<div><b>הטעינה נכשלה</b><span>'+String(message)+'</span></div>'}
window.addEventListener('error',ev=>showBootError(ev.message||'JavaScript error'));
window.addEventListener('unhandledrejection',ev=>showBootError((ev.reason&&ev.reason.message)||ev.reason||'Unhandled promise rejection'));
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_URLS=[
 {url:'./models/morph_loomis_head_arkit_oculus.glb',label:'local physical GLB'},
 {url:'./assets/morph-loomis-head/morph_loomis_head_arkit_oculus.glb',label:'repo asset GLB'},
 {url:'https://models.readyplayer.me/65a8dba831b23abb4f401bae.glb?morphTargets=ARKit,Oculus%20Visemes&textureAtlas=none&lod=0',label:'Ready Player Me remote'}
];
const PRESETS={smile:{mouthSmileLeft:.8,mouthSmileRight:.8,cheekSquintLeft:.25,cheekSquintRight:.25,smile:.8},surprise:{jawOpen:.65,eyeWideLeft:.75,eyeWideRight:.75,browInnerUp:.7,browOuterUpLeft:.45,browOuterUpRight:.45},angry:{browDownLeft:.8,browDownRight:.8,eyeSquintLeft:.35,eyeSquintRight:.35,mouthFrownLeft:.3,mouthFrownRight:.3},talk:{jawOpen:.45,mouthFunnel:.25,mouthPucker:.12,viseme_aa:.55}};
const $=id=>document.getElementById(id),statusEl=$('status'),errorEl=$('error'),bootEl=$('boot'),slidersEl=$('sliders'),host=$('canvasHost'),stage=$('stage');
let scene,camera,renderer,loader,modelGroup=null,loomisGroup=null,morphs=[],values={},activeTab='all',wire=false,overlay=true,rotX=0,rotY=0,zoom=1,panX=0,panY=0,lastPinch=0,lastCenter=null;
const pointers=new Map();
const setStatus=t=>statusEl.textContent=t;
const setError=t=>{errorEl.textContent=t||'';errorEl.classList.toggle('show',!!t)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

init();
function init(){
 setStatus('מאתחל WebGL...');
 scene=new THREE.Scene();scene.background=new THREE.Color(0x070b16);
 camera=new THREE.PerspectiveCamera(32,1,.01,100);camera.position.set(0,0,3.0);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x20304f,2.15));
 const key=new THREE.DirectionalLight(0xffffff,2.35);key.position.set(1.8,2.6,2.8);scene.add(key);
 const fill=new THREE.DirectionalLight(0x8fc7ff,.85);fill.position.set(-2.5,.6,1.4);scene.add(fill);
 loader=new GLTFLoader();loader.setCrossOrigin('anonymous');
 addEvents();resize();addEventListener('resize',resize);requestAnimationFrame(tick);loadModelChain(0);
}
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);camera.aspect=Math.max(1,r.width)/Math.max(1,r.height);camera.updateProjectionMatrix()}
function tick(){requestAnimationFrame(tick);if(modelGroup){modelGroup.rotation.set(rotX,rotY,0);modelGroup.position.set(panX,panY,0);modelGroup.scale.setScalar(zoom*modelGroup.userData.baseScale)}if(loomisGroup)loomisGroup.visible=overlay;renderer.render(scene,camera)}
function addEvents(){
 $('grab').addEventListener('click',()=>{document.body.classList.toggle('compact');setTimeout(resize,240)});
 stage.addEventListener('pointerdown',ev=>{pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});stage.setPointerCapture?.(ev.pointerId);lastPinch=pinchDistance();lastCenter=pointerCenter()});
 stage.addEventListener('pointermove',ev=>{if(!pointers.has(ev.pointerId))return;const old=pointers.get(ev.pointerId);pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});if(pointers.size===1){rotY+=(ev.clientX-old.x)*.008;rotX=clamp(rotX+(ev.clientY-old.y)*.008,-1.05,1.05)}else if(pointers.size>=2){const d=pinchDistance(),c=pointerCenter();if(lastPinch>0)zoom=clamp(zoom*(d/lastPinch),.42,2.8);if(lastCenter){panX+=(c.x-lastCenter.x)/stage.clientHeight*2.0;panY-=(c.y-lastCenter.y)/stage.clientHeight*2.0}lastPinch=d;lastCenter=c}});
 const end=ev=>{pointers.delete(ev.pointerId);lastPinch=pinchDistance();lastCenter=pointerCenter()};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
 stage.addEventListener('wheel',ev=>{ev.preventDefault();zoom=clamp(zoom-ev.deltaY*.001,.42,2.8)},{passive:false});
 $('fileInput').addEventListener('change',ev=>{const f=ev.target.files&&ev.target.files[0];if(f)loadModel(URL.createObjectURL(f),f.name,false)});
 $('loomisBtn').addEventListener('click',()=>{overlay=!overlay;$('loomisBtn').classList.toggle('on',overlay)});
 $('wireBtn').addEventListener('click',()=>{wire=!wire;$('wireBtn').classList.toggle('on',wire);applyWire()});
 $('centerBtn').addEventListener('click',resetView);
 $('resetBtn').addEventListener('click',()=>resetMorphs(true));$('reloadBtn').addEventListener('click',()=>loadModelChain(0));
 document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.preset)));
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));renderSliders()}));
}
function pointerCenter(){const a=[...pointers.values()];if(!a.length)return null;return{x:a.reduce((s,p)=>s+p.x,0)/a.length,y:a.reduce((s,p)=>s+p.y,0)/a.length}}
function pinchDistance(){const a=[...pointers.values()];if(a.length<2)return 0;return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
function resetView(){rotX=0;rotY=0;zoom=1;panX=0;panY=0}
function loadModelChain(i){const item=MODEL_URLS[i];if(!item){setStatus('המודל לא נטען');setError('לא הצלחתי לטעון את ה־GLB המקומי או את הגיבוי.');bootEl.innerHTML='<div><b>המודל לא נטען</b><span>נסה רענון מלא או Upload GLB.</span></div>';return}loadModel(item.url,item.label,true,()=>loadModelChain(i+1))}
function clearModel(){if(modelGroup){scene.remove(modelGroup);dispose(modelGroup);modelGroup=null}loomisGroup=null;morphs=[];values={};slidersEl.innerHTML=''}
function dispose(obj){obj.traverse(o=>{o.geometry?.dispose?.();const m=o.material;if(m)(Array.isArray(m)?m:[m]).forEach(x=>x.dispose?.())})}
function loadModel(url,label,clear,onFail){clearModel();setError('');setStatus('טוען '+label+'...');bootEl.style.display='grid';bootEl.innerHTML='<div><b>Morph Head Studio</b><span>טוען GLB פיזי...</span></div>';loader.load(url,gltf=>{try{installModel(gltf.scene,label)}catch(e){console.error(e);if(onFail)onFail();else showBootError(e.message||e)}},p=>{if(p.total)setStatus('טוען '+label+' '+Math.round(p.loaded/p.total*100)+'%')},err=>{console.error('GLB load failed',label,err);if(onFail)onFail();else{setStatus('המודל לא נטען');setError('טעינת GLB נכשלה.')}})}
function installModel(raw,label){
 raw.updateMatrixWorld(true);
 const analysis=analyzeHead(raw);if(!analysis||!analysis.box)throw new Error('ה־GLB נטען אבל לא נמצא אזור ראש תקין');
 raw.position.sub(analysis.center);raw.updateMatrixWorld(true);
 hideNonHeadMeshes(analysis);
 modelGroup=new THREE.Group();modelGroup.name='head_model_group';modelGroup.add(raw);
 const headSize=Math.max(analysis.size.x,analysis.size.z,analysis.size.y*.72,.001);
 modelGroup.userData.baseScale=1.70/headSize;
 loomisGroup=makeLoomis(analysis);modelGroup.add(loomisGroup);
 scene.add(modelGroup);morphs=collectMorphs(modelGroup);applyWire();resetMorphs(false);renderSliders();resetView();bootEl.style.display='none';setStatus((morphs.length?morphs.length+' morph targets נמצאו':'המודל נטען ללא morph targets')+' · '+label)
}
function meshEntry(o){o.geometry.computeBoundingBox();const b=o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);const c=b.getCenter(new THREE.Vector3());const s=b.getSize(new THREE.Vector3());const hasMorph=!!(o.morphTargetDictionary&&Object.keys(o.morphTargetDictionary).length);return{mesh:o,box:b,center:c,size:s,hasMorph}}
function union(entries){if(!entries.length)return null;const b=new THREE.Box3();entries.forEach(e=>b.union(e.box));return b}
function analyzeHead(root){
 const entries=[];root.traverse(o=>{if(o.isMesh&&o.geometry)entries.push(meshEntry(o))});
 if(!entries.length)return null;
 let morphEntries=entries.filter(e=>e.hasMorph);
 let baseBox=union(morphEntries);
 if(!baseBox){const all=union(entries);const y=all.min.y+all.getSize(new THREE.Vector3()).y*.68;morphEntries=entries.filter(e=>e.center.y>=y);baseBox=union(morphEntries.length?morphEntries:entries)}
 const bc=baseBox.getCenter(new THREE.Vector3()),bs=baseBox.getSize(new THREE.Vector3());
 const xLim=Math.max(bs.x*1.45,bs.y*.40,bs.z*1.45),zLim=Math.max(bs.z*1.55,bs.x*1.15),yMin=bc.y-bs.y*.72,yMax=bc.y+bs.y*.72;
 let headEntries=entries.filter(e=>e.hasMorph||(Math.abs(e.center.x-bc.x)<xLim&&Math.abs(e.center.z-bc.z)<zLim&&e.center.y>yMin&&e.center.y<yMax));
 let headBox=union(headEntries.length?headEntries:morphEntries);
 const center=headBox.getCenter(new THREE.Vector3()),size=headBox.getSize(new THREE.Vector3());
 return{entries,headEntries,box:headBox,center,size,baseBox}
}
function hideNonHeadMeshes(a){
 const sx=Math.max(a.size.x,a.size.z),sy=a.size.y;
 a.entries.forEach(e=>{
  const r=e.center.clone().sub(a.center);
  const keep=e.hasMorph||(Math.abs(r.x)<sx*.95&&Math.abs(r.z)<sx*1.15&&e.box.max.y-a.center.y>-sy*.58&&e.box.min.y-a.center.y<sy*.80);
  e.mesh.visible=keep;e.mesh.frustumCulled=false;
 })
}
function getBox(root){const box=new THREE.Box3();let ok=false;root.updateMatrixWorld(true);root.traverse(o=>{if(o.isMesh&&o.geometry&&o.visible){o.geometry.computeBoundingBox();const b=o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);if(!ok){box.copy(b);ok=true}else box.union(b)}});return ok?box:null}
function collectMorphs(root){const map=new Map();root.traverse(o=>{if(o.isMesh&&o.visible&&o.morphTargetDictionary&&o.morphTargetInfluences){Object.keys(o.morphTargetDictionary).forEach(name=>{if(!map.has(name))map.set(name,[]);map.get(name).push({mesh:o,index:o.morphTargetDictionary[name]})})}});return [...map.entries()].map(([name,targets])=>({name,targets})).sort((a,b)=>a.name.localeCompare(b.name))}
function setMorph(name,value){values[name]=value;const it=morphs.find(m=>m.name===name);if(it)it.targets.forEach(t=>t.mesh.morphTargetInfluences[t.index]=value)}
function resetMorphs(ui=true){morphs.forEach(m=>setMorph(m.name,0));values={};if(ui)renderSliders()}
function applyPreset(name){resetMorphs(false);const preset=PRESETS[name]||{};Object.entries(preset).forEach(([n,v])=>setMorph(n,v));renderSliders()}
function filterName(n){if(activeTab==='eyes')return/eye|cheek/i.test(n);if(activeTab==='mouth')return/mouth|jaw|tongue|viseme|aa|ee|oh|ou/i.test(n);if(activeTab==='brows')return/brow/i.test(n);return true}
function renderSliders(){slidersEl.innerHTML='';const list=morphs.filter(m=>filterName(m.name));if(!list.length){slidersEl.innerHTML='<div class="hint">אין סליידרים בקטגוריה הזאת.</div>';return}for(const item of list){const row=document.createElement('label');row.className='slider';const name=document.createElement('span');name.textContent=item.name;const input=document.createElement('input');input.type='range';input.min='0';input.max='1';input.step='0.01';input.value=values[item.name]||0;const out=document.createElement('output');out.textContent=Number(input.value).toFixed(2);input.addEventListener('input',()=>{const v=parseFloat(input.value);out.textContent=v.toFixed(2);setMorph(item.name,v)});row.append(name,input,out);slidersEl.appendChild(row)}}
function applyWire(){if(!modelGroup)return;modelGroup.traverse(o=>{if(o.isMesh&&o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.wireframe=wire;m.needsUpdate=true})})}
function makeLoomis(a){
 const g=new THREE.Group();g.name='loomis_overlay';
 const sx=Math.max(a.size.x,a.size.z),sy=a.size.y;
 const r=Math.max(sx*.54,sy*.30,.001);
 const y=sy*.08;
 const lineMat=new THREE.LineBasicMaterial({color:0x7dd3fc,transparent:true,opacity:.95,depthTest:false});
 const ghostMat=new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.13,depthTest:false});
 const sphere=new THREE.Mesh(new THREE.SphereGeometry(r,56,28),ghostMat);sphere.scale.set(1,.96,.92);sphere.position.y=y;g.add(sphere);
 function ring(rx,ry,rz,px=0,py=y,pz=0,scx=1,scy=1){const pts=new THREE.EllipseCurve(0,0,r*scx,r*scy,0,Math.PI*2,false,0).getPoints(144);const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat);l.rotation.set(rx,ry,rz);l.position.set(px,py,pz);l.renderOrder=20;g.add(l)}
 ring(Math.PI/2,0,0,0,y,0,1,.92);ring(0,Math.PI/2,0,0,y,0,.92,1);ring(0,0,0,0,y,0,1,.96);
 const eyeY=y-r*.05;
 g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-r*1.18,eyeY,0),new THREE.Vector3(r*1.18,eyeY,0)]),lineMat));
 g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,y+r*1.15,0),new THREE.Vector3(0,y-r*1.75,0)]),lineMat));
 return g
}
</script>
</body>
</html>
