<body class="compact">
<div id="app"><main id="stage"><div id="canvasHost"></div><div id="boot"><div><b>Morph Head Studio</b><span>טוען מנוע תלת־ממד...</span></div></div></main><section id="panel"><button id="grab" aria-label="פתיחה וסגירה של הפאנל"></button><header><div><h1>Morph Head Studio</h1><div id="status">מאתחל...</div></div><label class="upload">Upload GLB<input id="fileInput" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" /></label></header><div id="error"></div><div class="row"><button id="loomisBtn" class="on">Loomis</button><button id="cropBtn" class="on">Head crop</button><button id="wireBtn">Wire</button><button id="centerBtn">Center</button><button id="resetBtn">Reset</button><button id="reloadBtn">Reload</button></div><div class="row"><button data-preset="smile">Smile</button><button data-preset="surprise">Surprise</button><button data-preset="angry">Angry</button><button data-preset="talk">Talk</button></div><div class="row" id="tabs"><button data-tab="all" class="on">All</button><button data-tab="eyes">Eyes</button><button data-tab="mouth">Mouth</button><button data-tab="brows">Brows</button></div><div class="hint">Loomis אמיתי: כדור גולגולת, side planes, קו מרכז, קו עיניים, חלוקת brow/nose/chin ולסת.</div><div id="sliders"></div></section></div>
<script>
function showBootError(message){var s=document.getElementById('status'),e=document.getElementById('error'),b=document.getElementById('boot');if(s)s.textContent='שגיאה בטעינה';if(e){e.textContent=String(message);e.classList.add('show')}if(b)b.innerHTML='<div><b>הטעינה נכשלה</b><span>'+String(message)+'</span></div>'}
window.addEventListener('error',ev=>showBootError(ev.message||'JavaScript error'));
window.addEventListener('unhandledrejection',ev=>showBootError((ev.reason&&ev.reason.message)||ev.reason||'Unhandled promise rejection'));
</script>
<script type="module">
import * as THREE from 'three';

function pointerCenter(){const a=[...pointers.values()];return a.length?{x:a.reduce((s,p)=>s+p.x,0)/a.length,y:a.reduce((s,p)=>s+p.y,0)/a.length}:null}function pinchDistance(){const a=[...pointers.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}function resetView(){rotX=0;rotY=0;zoom=1;panX=0;panY=0}
function loadModelChain(i){const item=MODEL_URLS[i];if(!item){setStatus('המודל לא נטען');setError('לא הצלחתי לטעון את ה־GLB המקומי או את הגיבוי.');bootEl.innerHTML='<div><b>המודל לא נטען</b><span>נסה רענון מלא או Upload GLB.</span></div>';return}loadModel(item.url,item.label,true,()=>loadModelChain(i+1))}
function clearModel(){if(modelGroup){scene.remove(modelGroup);dispose(modelGroup);modelGroup=null}loomisGroup=null;morphs=[];values={};slidersEl.innerHTML=''}function dispose(obj){obj.traverse(o=>{o.geometry?.dispose?.();const m=o.material;if(m)(Array.isArray(m)?m:[m]).forEach(x=>x.dispose?.())})}
function loadModel(url,label,clear,onFail){clearModel();setError('');setStatus('טוען '+label+'...');bootEl.style.display='grid';bootEl.innerHTML='<div><b>Morph Head Studio</b><span>טוען GLB פיזי...</span></div>';loader.load(url,gltf=>{try{installModel(gltf.scene,label)}catch(e){console.error(e);if(onFail)onFail();else showBootError(e.message||e)}},p=>{if(p.total)setStatus('טוען '+label+' '+Math.round(p.loaded/p.total*100)+'%')},err=>{console.error(err);if(onFail)onFail();else setError('טעינת GLB נכשלה.')})}
function installModel(raw,label){raw.updateMatrixWorld(true);const h=headMetrics(raw);if(!h)throw new Error('לא נמצא ראש במודל');raw.position.sub(h.center);raw.updateMatrixWorld(true);modelGroup=new THREE.Group();modelGroup.add(raw);modelGroup.userData.baseScale=1.55/Math.max(h.headLen,.001);clipLocalY=h.neckY-h.center.y;loomisGroup=makeLoomis(h);modelGroup.add(loomisGroup);scene.add(modelGroup);applyClipMaterials();applyWire();morphs=collectMorphs(modelGroup);resetMorphs(false);renderSliders();resetView();bootEl.style.display='none';setStatus((morphs.length?morphs.length+' morph targets נמצאו':'המודל נטען ללא morph targets')+' · '+label)}
function headMetrics(root){const all=new THREE.Box3(),tmp=new THREE.Vector3();let ok=false;root.traverse(o=>{if(o.isMesh&&o.geometry){o.geometry.computeBoundingBox();const b=o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);if(!ok){all.copy(b);ok=true}else all.union(b)}});if(!ok)return null;const size=all.getSize(new THREE.Vector3()),top=all.max.y,height=size.y,full=height>Math.max(size.x,size.z)*1.45;let headLen,chinY,neckY,centerX=0,centerZ=0;if(full){headLen=height*.18;chinY=top-headLen*.88;neckY=top-headLen*1.16}else{headLen=size.y*.86;chinY=all.min.y+size.y*.08;neckY=all.min.y}let pts=[];root.traverse(o=>{if(!o.isMesh||!o.geometry||!o.geometry.attributes.position)return;const pos=o.geometry.attributes.position,step=Math.max(1,Math.floor(pos.count/12000));for(let i=0;i<pos.count;i+=step){tmp.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld);if(tmp.y>chinY&&tmp.y<top+height*.01)pts.push(tmp.clone())}});if(pts.length){centerX=pts.reduce((s,p)=>s+p.x,0)/pts.length;centerZ=pts.reduce((s,p)=>s+p.z,0)/pts.length}else{const c=all.getCenter(new THREE.Vector3());centerX=c.x;centerZ=c.z}const center=new THREE.Vector3(centerX,(top+chinY)/2,centerZ);let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z)});const width=isFinite(minX)?Math.max(maxX-minX,maxZ-minZ):headLen*.72;const radius=Math.max(width*.58,headLen*.32);return{center,topY:top,chinY,neckY,headLen,radius,frontZ:(isFinite(maxZ)?maxZ-centerZ:radius*.72)}}

function circle(mat,r,rot,pos,sx=1,sy=1){const pts=new THREE.EllipseCurve(0,0,r*sx,r*sy,0,Math.PI*2,false,0).getPoints(128);const l=makeLine(pts.map(p=>new THREE.Vector3(p.x,p.y,0)),mat);l.rotation.set(rot.x||0,rot.y||0,rot.z||0);l.position.copy(pos);return l}
function makeLoomis(h){const g=new THREE.Group();g.name='real_loomis_head';const cyan=new THREE.LineBasicMaterial({color:0x76d7ff,transparent:true,opacity:.96,depthTest:false}),dim=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.40,depthTest:false}),jawMat=new THREE.LineBasicMaterial({color:0x9be7ff,transparent:true,opacity:.92,depthTest:false});const r=h.radius,top=h.topY-h.center.y,chin=h.chinY-h.center.y,headLen=h.headLen,front=Math.max(h.frontZ,r*.78);const ballY=top-headLen*.36,brow=top-headLen*.43,nose=top-headLen*.66,mouth=top-headLen*.78,chinY=chin,sideX=r*.55,sideR=r*.43;g.add(circle(cyan,r,{z:0},new THREE.Vector3(0,ballY,0),.92,1));g.add(circle(dim,r,{x:Math.PI/2},new THREE.Vector3(0,ballY,0),.92,.86));g.add(circle(cyan,sideR,{y:Math.PI/2},new THREE.Vector3(-sideX,ballY,0),1,1));g.add(circle(cyan,sideR,{y:Math.PI/2},new THREE.Vector3(sideX,ballY,0),1,1));g.add(makeLine([new THREE.Vector3(-sideX,brow,front),new THREE.Vector3(sideX,brow,front)],cyan));g.add(makeLine([new THREE.Vector3(0,top+r*.03,front),new THREE.Vector3(0,chinY,front)],cyan));g.add(makeLine([new THREE.Vector3(-sideX,nose,front*.98),new THREE.Vector3(sideX,nose,front*.98)],dim));g.add(makeLine([new THREE.Vector3(-sideX,mouth,front*.96),new THREE.Vector3(sideX,mouth,front*.96)],dim));g.add(makeLine([new THREE.Vector3(-sideX,chinY,front*.92),new THREE.Vector3(sideX,chinY,front*.92)],dim));g.add(makeLine([new THREE.Vector3(-sideX,brow,front),new THREE.Vector3(-sideX,nose,front*.98),new THREE.Vector3(-r*.35,chinY,front*.9),new THREE.Vector3(0,chinY-headLen*.03,front*.93),new THREE.Vector3(r*.35,chinY,front*.9),new THREE.Vector3(sideX,nose,front*.98),new THREE.Vector3(sideX,brow,front)],jawMat));g.add(makeLine([new THREE.Vector3(-sideX,brow,front),new THREE.Vector3(-sideX,ballY+sideR*.75,0),new THREE.Vector3(sideX,ballY+sideR*.75,0),new THREE.Vector3(sideX,brow,front)],dim));g.add(makeLine([new THREE.Vector3(-sideX,brow,front),new THREE.Vector3(0,chinY-headLen*.03,front*.93) function collectMorphs(root){const map=new Map();root.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary&&o.morphTargetInfluences){Object.keys(o.morphTargetDictionary).forEach(name=>{if(!map.has(name))map.set(name,[]);map.get(name).push({mesh:o,index:o.morphTargetDictionary[name]})})}});return[...map.entries()].map(([name,targets])=>({name,targets})).sort((a,b)=>a.name.localeCompare(b.name))}
