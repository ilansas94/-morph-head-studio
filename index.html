<body class="compact">
<div id="app">
<main id="stage"><div id="canvasHost"></div><div id="boot"><div><b>Morph Head Studio</b><span>טוען מנוע תלת־ממד...</span></div></div></main>

<button id="grab" aria-label="פתיחה וסגירה של הפאנל"></button>
<header><div><h1>Morph Head Studio</h1><div id="status">מאתחל...</div></div><label class="upload">Upload GLB<input id="fileInput" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" /></label></header>

<div class="row"><button id="wireBtn">Wire</button><button id="centerBtn">Center</button><button id="resetBtn">Reset</button><button id="reloadBtn">Reload</button><button data-preset="smile">Smile</button><button data-preset="surprise">Surprise</button></div>

<div class="hint">ה־Loomis מעוגן למישור הפנים: גולגולת, side planes, קו עיניים, חלוקה לאף/סנטר ולסת. Flip guide מחליף צד במקרה שהמודל הפוך.</div>

</section>

<script>
function showBootError(message){var s=document.getElementById('status'),e=document.getElementById('error'),b=document.getElementById('boot');if(s)s.textContent='שגיאה בטעינה';if(e){e.textContent=String(message);e.classList.add('show')}if(b)b.innerHTML='<div><b>הטעינה נכשלה</b><span>'+String(message)+'</span></div>'}
window.addEventListener('error',ev=>showBootError(ev.message||'JavaScript error'));
window.addEventListener('unhandledrejection',ev=>showBootError((ev.reason&&ev.reason.message)||ev.reason||'Unhandled promise rejection'));
</script>
<script type="module">

function pointerCenter(){const a=[...pointers.values()];return a.length?{x:a.reduce((s,p)=>s+p.x,0)/a.length,y:a.reduce((s,p)=>s+p.y,0)/a.length}:null}function pinchDistance(){const a=[...pointers.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}function resetView(){rotX=0;rotY=0;zoom=1;panX=0;panY=.02}

function sampleModel(root){const samples=[],all=new THREE.Box3();let ok=false;const v=new THREE.Vector3();root.traverse(o=>{if(o.isMesh&&o.geometry&&o.geometry.attributes.position){o.geometry.computeBoundingBox();const b=o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);if(!ok){all.copy(b);ok=true}else all.union(b);const pos=o.geometry.attributes.position,step=Math.max(1,Math.floor(pos.count/12000));for(let i=0;i<pos.count;i+=step){v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld);samples.push(v.clone())}}});return ok?{samples,all}:null}
function headMetrics(root){const data=sampleModel(root);if(!data)return null;const {samples,all}=data,size=all.getSize(new THREE.Vector3()),height=Math.max(size.y,.001),top=all.max.y,full=height>Math.max(size.x,size.z)*1.25;let topY=top,chinY,neckY,cropY,headLen;if(full){headLen=height*.135;chinY=topY-headLen;neckY=topY-headLen*1.18;cropY=topY-headLen*1.42}else{headLen=height*.78;chinY=all.min.y+height*.06;neckY=all.min.y;cropY=all.min.y-height*.02}let headPts=samples.filter(p=>p.y>chinY-headLen*.05&&p.y<topY+headLen*.05);if(headPts.length<20)headPts=samples.filter(p=>p.y>topY-headLen*1.15);let cx=median(headPts.map(p=>p.x)),cz=median(headPts.map(p=>p.z));let xs=headPts.map(p=>p.x),zs=headPts.map(p=>p.z);const roughW=Math.max(q(xs,.92)-q(xs,.08),q(zs,.92)-q(zs,.08),headLen*.55);headPts=headPts.filter(p=>Math.abs(p.x-cx)<roughW*.8&&Math.abs(p.z-cz)<roughW*.8);if(headPts.length>20){cx=median(headPts.map(p=>p.x));cz=median(headPts.map(p=>p.z));xs=headPts.map(p=>p.x);zs=headPts.map(p=>p.z)}const headWidth=Math.max(q(xs,.92)-q(xs,.08),q(zs,.92)-q(zs,.08),headLen*.58);const center=new THREE.Vector3(cx,(topY+chinY)/2,cz);const radius=headLen*.385;const frontZ=Math.max(Math.abs(q(zs,.96)-cz),Math.abs(cz-q(zs,.04)),headLen*.34);return{center,topY,chinY,neckY,cropY,headLen,radius,frontZ,headWidth}}
